name: Test and build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tutorial/skydiver

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"

      - name: Export notebook code
        run: nbdev-export

      - name: Confirm generated code is committed
        run: git diff --exit-code

      - name: Run tests
        run: pytest -q

      - name: Build wheel
        run: python -m build --wheel
